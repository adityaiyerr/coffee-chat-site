<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music</title>
<link rel="icon" type="image/png" href="/pf.png">
<link rel="apple-touch-icon" href="/pf.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c0b;
    --phosphor:#8fb99a;
    --phosphor-dim:#4f6b58;
    --amber:#d3a24a;
    --rule:#1c2a20;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--phosphor);
    font-family:var(--mono);
    font-size:13px;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 28px;
    border-bottom:1px solid var(--rule);
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--phosphor-dim);
  }
  .topbar a{color:var(--phosphor-dim);text-decoration:none;transition:color .15s}
  .topbar a:hover{color:var(--amber)}
  .body{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:10px;padding:40px 28px;
  }
  .status{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--phosphor-dim)}
  .msg{color:var(--amber);font-size:13px;letter-spacing:.06em}
  .cursor{
    display:inline-block;width:8px;height:1em;
    background:var(--amber);vertical-align:-2px;margin-left:3px;
    animation:blink 1.1s step-end infinite;
  }
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.cursor{animation:none}}
</style>
</head>
<body>
<div class="topbar">
  <a href="/">← terminal</a>
  <span>music</span>
</div>
<div class="body">
  <div class="status">Section status</div>
  <div class="msg">coming online<span class="cursor" aria-hidden="true"></span></div>
</div>
</body>
</html>
