<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research</title>
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c0b;
    --panel:#0f1310;
    --phosphor:#8fb99a;
    --dim:#4f6b58;
    --amber:#d3a24a;
    --amber-dim:#8a6c33;
    --cream:#fbf7f0;
    --rule:#1c2a20;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    --serif:'Cormorant Garamond',Georgia,serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    background:var(--bg);
    color:var(--phosphor);
    font-family:var(--mono);
    font-size:13px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 28px;
    border-bottom:1px solid var(--rule);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--dim);
  }
  .topbar a{color:var(--dim);text-decoration:none;transition:color .15s}
  .topbar a:hover{color:var(--amber)}

  .screen{
    max-width:820px;
    margin:0 auto;
    padding:40px 28px 72px;
  }

  .section-head{
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:20px;
  }

  .divider{
    border:none;
    border-top:1px solid var(--rule);
    margin:0 0 0;
  }

  /* ── REPORT LIST ── */
  .report-list{
    margin:0 0 32px;
  }

  .report-row{
    display:flex;
    align-items:baseline;
    gap:0;
    padding:13px 12px;
    border-bottom:1px solid var(--rule);
    cursor:pointer;
    outline:none;
    text-decoration:none;
    color:inherit;
    transition:background .08s;
  }
  .report-row:first-child{
    border-top:1px solid var(--rule);
  }
  .report-row:hover,
  .report-row.active{
    background:var(--panel);
  }
  .report-row.active .report-idx{
    color:var(--amber);
  }
  .report-row.active .report-name{
    color:var(--amber);
  }

  .report-idx{
    color:var(--amber-dim);
    font-size:11px;
    font-weight:600;
    letter-spacing:.08em;
    flex-shrink:0;
    width:32px;
  }

  .report-name{
    flex:1;
    font-size:13px;
    color:var(--cream);
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .report-pipe{
    color:var(--dim);
    padding:0 10px;
    flex-shrink:0;
  }

  .report-date{
    font-size:11px;
    color:var(--dim);
    flex-shrink:0;
    letter-spacing:.06em;
  }

  /* ── HINT BAR ── */
  .hint{
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--dim);
    display:flex;
    gap:24px;
    margin-top:16px;
  }
  .hint-key{
    color:var(--amber-dim);
    margin-right:5px;
  }

  @media(max-width:540px){
    .screen{padding:28px 18px 56px}
    .topbar{padding:10px 18px}
    .report-pipe,.report-date{display:none}
    .report-name{white-space:normal;overflow:visible;text-overflow:unset}
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="/">← terminal</a>
  <span>research</span>
</div>

<main class="screen">

  <div class="section-head">Equity Research</div>

  <hr class="divider">

  <div class="report-list" id="report-list" role="listbox" aria-label="Research reports">

    <a class="report-row" href="/research/pillars-prologue/" role="option" tabindex="0" aria-label="Five Pillars of Civilization: Series Prologue, Sep 2026">
      <span class="report-idx">01</span>
      <span class="report-name">Five Pillars of Civilization: Series Prologue</span>
      <span class="report-pipe">|</span>
      <span class="report-date">Sep 2026</span>
    </a>

  </div>

  <div class="hint">
    <span><span class="hint-key">↑ ↓</span> navigate</span>
    <span><span class="hint-key">Enter</span> open</span>
    <span><span class="hint-key">j k</span> vi keys</span>
  </div>

</main>

<script>
  var rows = Array.from(document.querySelectorAll('.report-row'));
  var sel = -1;

  function activate(i){
    rows.forEach(function(r,j){ r.classList.toggle('active', j===i); });
    sel = i;
  }

  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowDown' || e.key==='j'){
      e.preventDefault();
      activate(Math.min(sel+1, rows.length-1));
    } else if(e.key==='ArrowUp' || e.key==='k'){
      e.preventDefault();
      activate(Math.max(sel-1, 0));
    } else if(e.key==='Enter' && sel>=0){
      window.location.href = rows[sel].href;
    }
  });

  rows.forEach(function(r,i){
    r.addEventListener('mouseenter', function(){ activate(i); });
    r.addEventListener('mouseleave', function(){ activate(-1); });
    r.addEventListener('focus',      function(){ activate(i); });
    r.addEventListener('blur',       function(){ activate(-1); });
  });
</script>

</body>
</html>
