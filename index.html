<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aditya Iyer — Terminal</title>
<meta name="description" content="Aditya Iyer — equity research, outreach, and ventures. Enter the terminal.">

<!-- Favicon: an amber prompt glyph on near-black. Swap for a real .ico/.png later. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0c0b'/%3E%3Ctext x='5' y='23' font-family='monospace' font-size='17' fill='%23d3a24a'%3E%26gt;_%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    /* Terminal palette — tied to the old-money brand:
       phosphor is a muted sage (descended from forest #20382d),
       amber is a warmer sibling of the brand gold #a78954. */
    --bg:#0a0c0b;
    --panel:#0f1310;
    --phosphor:#8fb99a;
    --phosphor-dim:#4f6b58;
    --amber:#d3a24a;
    --amber-dim:#8a6c33;
    --cream:#fbf7f0;
    --rule:#1c2a20;
    --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    --font-serif:'Cormorant Garamond',Georgia,serif;
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);
    color:var(--phosphor);
    font-family:var(--font-mono);
    font-size:15px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    min-height:100%;
  }

  /* Subtle CRT scanlines + vignette. Purely atmospheric, sits above the bg. */
  .crt{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:
      linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.14) 50%),
      radial-gradient(120% 120% at 50% 40%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.35) 100%);
    background-size:100% 3px, 100% 100%;
    mix-blend-mode:multiply;
  }

  .screen{width:100%;max-width:860px;padding:32px 28px 22px;display:flex;flex-direction:column;min-height:100vh}

  .statusbar{display:flex;justify-content:space-between;align-items:center;
    color:var(--phosphor-dim);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    border-bottom:1px solid var(--rule);padding-bottom:10px}
  .dot{color:var(--amber)}

  /* Boot log */
  #boot{margin:18px 0 4px;min-height:112px}
  #boot .line{white-space:pre;color:var(--phosphor-dim)}
  #boot .ok{color:var(--amber)}

  /* Signature */
  .sig{margin:14px 0 2px;opacity:0}
  .sig.show{opacity:1;transition:opacity .5s ease}
  .sig .name{font-family:var(--font-serif);font-weight:600;color:var(--cream);
    font-size:clamp(40px,9vw,68px);line-height:1;letter-spacing:.01em}
  .sig .tagline{color:var(--phosphor);letter-spacing:.06em;margin-top:6px;font-size:14px}
  .sig .tagline b{color:var(--amber);font-weight:500}

  .hr{border:0;border-top:1px solid var(--rule);margin:20px 0 16px}

  /* Command output log */
  #log{margin:0 0 8px}
  #log .out{color:var(--phosphor)}
  #log .out .k{color:var(--amber)}
  #log .cmd{color:var(--cream)}
  #log .cmd::before{content:"> ";color:var(--amber)}

  /* Function keys */
  .keys{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:6px 0 22px;
    opacity:0}
  .keys.show{opacity:1;transition:opacity .5s ease .1s}
  .key{appearance:none;text-align:left;cursor:pointer;color:inherit;
    background:var(--panel);border:1px solid var(--rule);border-radius:6px;
    padding:13px 14px;font-family:inherit;transition:border-color .15s,background .15s;display:block}
  .key:hover,.key:focus-visible{background:#13251b;border-color:var(--amber-dim);outline:none}
  .key:focus-visible{box-shadow:0 0 0 1px var(--amber)}
  .key .fk{color:var(--amber);font-size:12px;letter-spacing:.12em}
  .key .label{color:#cfe0d3;font-size:15px;font-weight:500;margin-top:4px}
  .key .desc{color:var(--phosphor-dim);font-size:12px}

  /* Prompt input */
  .promptline{display:flex;align-items:center;gap:8px;border-top:1px solid var(--rule);
    padding-top:14px;opacity:0}
  .promptline.show{opacity:1;transition:opacity .5s ease .2s}
  .promptline .sigil{color:var(--amber)}
  #cmd{flex:1;background:transparent;border:0;outline:none;color:var(--cream);
    font-family:inherit;font-size:15px;caret-color:var(--amber)}
  #cmd::placeholder{color:var(--phosphor-dim)}

  /* Ticker */
  .ticker{margin-top:auto;overflow:hidden;white-space:nowrap;border-top:1px solid var(--rule);
    padding-top:12px;color:var(--phosphor-dim);font-size:12px;letter-spacing:.05em}
  .ticker span{display:inline-block;padding-left:100%;animation:tick 34s linear infinite}
  .ticker b{color:var(--amber);font-weight:500}

  footer{color:var(--phosphor-dim);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;margin-top:14px;display:flex;justify-content:space-between}
  footer a{color:var(--phosphor-dim);text-decoration:none;border-bottom:1px solid var(--rule)}
  footer a:hover{color:var(--amber);border-color:var(--amber-dim)}

  .cursor{display:inline-block;width:9px;height:1.05em;background:var(--amber);
    vertical-align:-2px;margin-left:2px;animation:blink 1.1s step-end infinite}

  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes tick{to{transform:translateX(-100%)}}

  @media (max-width:560px){
    .screen{padding:24px 18px 18px}
    .keys{grid-template-columns:repeat(2,1fr)}
    .keys .key:last-child:nth-child(odd){grid-column:1/-1;max-width:calc(50% - 6px)}
  }

  /* Quality floor: honour reduced-motion — no typing, blink, or scroll. */
  @media (prefers-reduced-motion:reduce){
    .cursor,.ticker span{animation:none}
    .sig,.keys,.promptline{opacity:1;transition:none}
    .ticker span{padding-left:0}
  }
</style>
</head>
<body>
<div class="crt" aria-hidden="true"></div>

<main class="screen">
  <div class="statusbar">
    <span>Iyer Terminal — v1.0</span>
    <span><span class="dot">●</span> session live</span>
  </div>

  <div id="boot" aria-hidden="true"></div>

  <div class="sig" id="sig">
    <div class="name">Aditya Iyer</div>
    <div class="tagline"><b>equity research</b> · outreach · ventures</div>
  </div>

  <hr class="hr">

  <div id="log" aria-live="polite"></div>

  <div class="keys" id="keys">
    <button class="key" data-key="research"><span class="fk">F1</span><span class="label">Research</span><span class="desc">equity reports</span></button>
    <button class="key" data-key="portfolio"><span class="fk">F2</span><span class="label">Portfolio</span><span class="desc">live tracker</span></button>
    <button class="key" data-key="sales-agent"><span class="fk">F3</span><span class="label">Sales Agent</span><span class="desc">B2B lead gen</span></button>
    <button class="key" data-key="resume"><span class="fk">F4</span><span class="label">Resume</span><span class="desc">cv &amp; background</span></button>
    <button class="key" data-key="music"><span class="fk">F5</span><span class="label">Music</span><span class="desc">tracks &amp; projects</span></button>
  </div>

  <div class="promptline" id="promptline">
    <span class="sigil">&gt;</span>
    <label for="cmd" class="visually-hidden" style="position:absolute;left:-9999px">Enter a command</label>
    <input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="type a command — try 'help'">
    <span class="cursor" id="cur" aria-hidden="true"></span>
  </div>

  <div class="ticker" aria-hidden="true">
    <span id="tickertext"></span>
  </div>

  <footer>
    <span>© 2026 Aditya Iyer</span>
    <span><a href="mailto:ahiyer@usc.edu">ahiyer@usc.edu</a></span>
  </footer>
</main>

<script>
/* ---------------------------------------------------------------------------
   SECTIONS — the rooms this lobby routes to.
   Flip `live:true` and set the real `path` once each room's folder exists.
   While `live:false`, the command prints a status line instead of 404-ing.
--------------------------------------------------------------------------- */
const SECTIONS = {
  research:      { label:'Research',    path:'/research/',    live:false },
  portfolio:     { label:'Portfolio',   path:'/portfolio/',   live:false },
  'sales-agent': { label:'Sales Agent', path:'/sales-agent/', live:false },
  resume:        { label:'Resume',      path:'/resume/',      live:false },
  music:         { label:'Music',       path:'/music/',       live:false },
};
const FKEYS = { F1:'research', F2:'portfolio', F3:'sales-agent', F4:'resume', F5:'music',
                '1':'research', '2':'portfolio', '3':'sales-agent', '4':'resume', '5':'music' };

const reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
const $ = s => document.querySelector(s);
const bootEl = $('#boot'), logEl = $('#log'), cmdEl = $('#cmd');

/* ---- Boot sequence -------------------------------------------------------- */
const bootLines = [
  ['initializing session', 'ok'],
  ['loading equity research desk', 'ok'],
  ['mounting outreach module', 'ok'],
  ['establishing uplink', 'ok'],
  ['terminal ready', ''],
];

function reveal(){
  $('#sig').classList.add('show');
  $('#keys').classList.add('show');
  $('#promptline').classList.add('show');
  if(!reduce) cmdEl.focus();
}

function runBoot(){
  if(reduce){
    bootLines.forEach(([t,s])=>{
      const d=document.createElement('div'); d.className='line';
      d.innerHTML = t.padEnd(30,' .') + ' ' + (s?`<span class="ok">${s}</span>`:'');
      bootEl.appendChild(d);
    });
    reveal(); return;
  }
  let i=0;
  (function next(){
    if(i>=bootLines.length){ setTimeout(reveal, 220); return; }
    const [t,s]=bootLines[i++];
    const d=document.createElement('div'); d.className='line';
    d.innerHTML = t.padEnd(30,' .') + ' ' + (s?`<span class="ok">${s}</span>`:'');
    bootEl.appendChild(d);
    setTimeout(next, 260);
  })();
}

/* ---- Command handling ----------------------------------------------------- */
function print(html, cls){ const d=document.createElement('div'); d.className=cls||'out'; d.innerHTML=html; logEl.appendChild(d); }
function echo(cmd){ print(cmd, 'cmd'); }

function activate(key){
  const s = SECTIONS[key];
  if(!s) return;
  if(s.live){ print(`opening <span class="k">${s.label}</span> …`); window.location.href = s.path; }
  else{ print(`<span class="k">${s.label}</span> :: coming online — reserved at <span class="k">${s.path}</span>`); }
}

const HELP = [
  'available commands',
  '  research      equity reports and theses',
  '  portfolio     live public portfolio tracker',
  '  sales-agent   B2B AI lead generation product',
  '  resume        cv and background',
  '  music         tracks and projects',
  '  about         who runs this terminal',
  '  contact       how to reach the desk',
  '  clear         wipe the screen',
].join('\n');

function handle(raw){
  const cmd = raw.trim().toLowerCase();
  if(!cmd) return;
  echo(raw.trim());
  if(SECTIONS[cmd]) return activate(cmd);
  switch(cmd){
    case 'help': case '?': case 'ls': print(`<span style="white-space:pre">${HELP}</span>`); break;
    case 'about': print('Aditya Iyer — finance student, equity researcher, and builder. This terminal is the front door to the work.'); break;
    case 'contact': print('email <span class="k">ahiyer@usc.edu</span>'); break;
    case 'clear': logEl.innerHTML=''; break;
    default: print(`command not found: <span class="k">${cmd}</span> — type <span class="k">help</span>`);
  }
}

cmdEl.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ handle(cmdEl.value); cmdEl.value=''; }
});

/* Function keys + number shortcuts, from anywhere on the page */
document.addEventListener('keydown', e=>{
  const map = FKEYS[e.key];
  if(map && (e.key.startsWith('F') || document.activeElement!==cmdEl)){
    e.preventDefault(); activate(map);
  }
});

/* Clickable key tiles */
document.querySelectorAll('.key').forEach(btn=>{
  btn.addEventListener('click', ()=>{ echo(btn.dataset.key); activate(btn.dataset.key); });
});

/* Clicking empty space returns focus to the prompt */
document.addEventListener('click', e=>{
  if(!e.target.closest('a,button,input')) cmdEl.focus();
});

/* ---- Ticker --------------------------------------------------------------- */
$('#tickertext').innerHTML =
  'IYER 1.0 <b>▲</b>  research desk online  ·  portfolio — live tracker coming soon  ·  ' +
  'sales agent — B2B lead gen in development  ·  resume — on file  ·  music — in the works  ·  type <b>help</b> to begin  ·  ';

runBoot();
</script>
</body>
</html>
